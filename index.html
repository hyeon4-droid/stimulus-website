<!DOCTYPE html>
<html lang="ko" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자극 (STIMULUS) — 변화와 성장의 모든 것</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#05070e',
                            card: 'rgba(15, 23, 42, 0.75)',
                            cyan: '#00f0ff',
                            magenta: '#ec4899',
                            violet: '#a855f7',
                            emerald: '#10b981',
                            amber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'Pretendard', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 25px rgba(0, 240, 255, 0.35)',
                        'neon-magenta': '0 0 25px rgba(236, 72, 153, 0.35)',
                        'neon-violet': '0 0 25px rgba(168, 85, 247, 0.35)'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #05070e;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-hover:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px -8px rgba(0, 240, 255, 0.25);
        }

        .text-glow-cyan {
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        .text-glow-magenta {
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
        }

        /* Pulse aura animation for breathing guide */
        @keyframes aura-pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.35); opacity: 0.9; }
        }
        .animate-aura {
            animation: aura-pulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#05070e] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-cyan-500 selection:text-black">

    <header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-violet-600 to-pink-500 flex items-center justify-center text-black font-extrabold text-lg shadow-neon-cyan group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-bolt text-slate-950"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-xl tracking-wider text-white leading-none">STIMULUS</span>
                    <span class="text-[10px] font-mono text-cyan-400 tracking-widest uppercase mt-0.5">자극 탐구 프로젝트</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="#definition" class="hover:text-cyan-400 transition-colors">자극의 정의</a>
                <a href="#pillars" class="hover:text-cyan-400 transition-colors">4대 카테고리</a>
                <a href="#labs" class="hover:text-cyan-400 transition-colors">인터랙티브 체험실</a>
            </nav>

            <!-- Global Audio Synth Toggle -->
            <button id="global-audio-btn" class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all shadow-md">
                <i id="global-audio-icon" class="fa-solid fa-volume-xmark text-rose-400"></i>
                <span id="global-audio-status">사운드 효과 OFF</span>
            </button>
        </div>
    </header>

    <section class="relative min-h-screen flex items-center justify-center pt-16 overflow-hidden">
        <!-- Interactive Neural Canvas -->
        <canvas id="hero-canvas" class="absolute inset-0 w-full h-full cursor-crosshair z-0"></canvas>
        
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#05070e]/50 to-[#05070e] pointer-events-none z-0"></div>

        <div class="relative z-10 max-w-5xl mx-auto px-4 text-center pointer-events-none">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-panel border-cyan-500/40 text-cyan-300 text-xs font-mono mb-6 animate-pulse pointer-events-auto shadow-neon-cyan">
                <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                INTERACTIVE NEURAL PULSE ENGINE
            </div>

            <h1 class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-white mb-6 leading-tight">
                자극 <span class="text-cyan-400 font-mono font-light text-2xl sm:text-5xl">(STIMULUS)</span>
                <span class="block text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-400 to-violet-500 mt-2 text-3xl sm:text-5xl md:text-6xl">
                    모든 변화와 성장의 시작점
                </span>
            </h1>

            <p class="max-w-2xl mx-auto text-slate-300 text-base sm:text-lg font-light leading-relaxed mb-10">
                작은 생체 신호부터 삶을 바꾸는 결정적 순간까지.<br class="hidden sm:block">
                우리의 몸과 마음, 창의성을 깨우는 자극과 반응의 메커니즘을 탐구해보세요.
            </p>

            <div class="flex flex-wrap items-center justify-center gap-4 pointer-events-auto">
                <a href="#labs" class="px-7 py-4 rounded-xl bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 hover:from-cyan-400 hover:to-violet-500 text-black font-extrabold text-sm tracking-wide shadow-neon-cyan transition-all transform hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-flask text-slate-950"></i> 자극 직접 체험하기
                </a>
                <a href="#definition" class="px-7 py-4 rounded-xl glass-panel hover:bg-slate-800/80 text-white text-sm font-semibold transition-all">
                    자극의 구조 알아보기
                </a>
            </div>

            <div class="mt-12 text-slate-400 text-xs flex items-center justify-center gap-2 pointer-events-auto">
                <i class="fa-solid fa-hand-pointer text-cyan-400 animate-bounce"></i>
                <span>화면을 움직이거나 클릭하여 전기적 충격파(Shockwave)를 일으켜보세요</span>
            </div>
        </div>
    </section>

    <section id="definition" class="py-24 relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <!-- Definition Card -->
            <div class="lg:col-span-7 glass-panel p-8 sm:p-10 rounded-3xl border-slate-800 relative
